name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  quality:
    name: Formato, código generado, análisis y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      # Los .g.dart/.freezed.dart están versionados: si alguien cambia un
      # modelo y no regenera, el build compilaría con código obsoleto.
      - name: Código generado al día
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib test > /dev/null
          git diff --exit-code -- lib test || {
            echo "::error::El código generado no está al día. Ejecuta: dart run build_runner build --delete-conflicting-outputs"
            exit 1
          }

      - name: Análisis estático
        run: flutter analyze

      # Incluye los tests de integración con Isar real (binario Linux de
      # isar_community_flutter_libs). La prueba contra un FacturaScripts real
      # se salta sola sin FS_URL/FS_TOKEN.
      - name: Tests
        run: flutter test --coverage

      - name: Cobertura del núcleo de sincronización (>= 80%)
        run: |
          awk -F: '
            /^SF:/ { file = $2 }
            /^LF:/ { if (file ~ /lib\/core\/(sync|settings|network)\// && file !~ /\.(g|freezed)\.dart$/) total += $2 }
            /^LH:/ { if (file ~ /lib\/core\/(sync|settings|network)\// && file !~ /\.(g|freezed)\.dart$/) hit += $2 }
            END {
              pct = 100 * hit / total
              printf "Cobertura núcleo: %.1f%% (%d/%d líneas)\n", pct, hit, total
              if (pct < 80) { print "::error::Cobertura del núcleo por debajo del 80%"; exit 1 }
            }' coverage/lcov.info

  android:
    name: Build Android (APK + alineación 16 KB)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug

      # Google Play rechaza librerías nativas alineadas a 4 KB (Android 15+).
      # Protege frente a regresiones de dependencias (p. ej. volver a isar).
      - name: Librerías nativas alineadas a 16 KB
        run: |
          unzip -q -o build/app/outputs/flutter-apk/app-debug.apk 'lib/arm64-v8a/*' -d apk
          status=0
          for so in apk/lib/arm64-v8a/*.so; do
            # Comparación NUMÉRICA de cada segmento LOAD (no lexicográfica).
            for align in $(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt $((0x4000)) ]; then
                echo "::error::$(basename "$so") tiene un segmento alineado a $align (se requiere >= 0x4000)"
                status=1
              fi
            done
            echo "Revisada $(basename "$so")"
          done
          exit $status
