name: app_preventa
description: "App Preventa y Autoventa Offline-First"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Fork mantenido de Isar 3 (misma API). isar 3.1.0+1 está abandonado: su
  # módulo Android no declara namespace (no compila con AGP 8+) y su
  # libisar.so está alineada a 4 KB (Google Play exige 16 KB).
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Tiempo simulado en los tests del orquestador (debounce, backoff).
  fake_async: any
  flutter_lints: ^3.0.0
  build_runner: ^2.5.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  isar_community_generator: ^3.4.1
  integration_test:
    sdk: flutter

flutter:
  # FIX: sin esto la fuente MaterialIcons no se empaqueta y TODOS los iconos
  # (sincronizar, ajustes, carrito...) se ven como cajas vacías en el móvil.
  uses-material-design: true
